name: Selenium E2E Tests - 300 Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Setup Google Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install root dependencies
        run: npm ci || npm install

      - name: Start Web App in background on port 8081
        run: |
          npx vite --port 8081 &
          echo "Waiting for app to respond on http://localhost:8081..."
          until curl -s http://localhost:8081 > /dev/null; do
            sleep 2
          done
          echo "App is ready on http://localhost:8081!"

      - name: Install Selenium test suite dependencies
        working-directory: ./collabroom-tests/selenium
        run: npm ci || npm install

      - name: Run all 300 Selenium tests
        working-directory: ./collabroom-tests/selenium
        run: npm test

      - name: Generate 300-Row Excel report
        working-directory: ./collabroom-tests/selenium
        run: npx ts-node generate-report.ts

      - name: Upload Selenium 300 Test Report artifact
        uses: actions/upload-artifact@v4
        with:
          name: selenium-report-300.xlsx
          path: collabroom-tests/reports/*.xlsx
